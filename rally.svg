<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Rally. Show up for something. Leave with a crew. rallynow.ca" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Rally</title>
  <defs>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0E1014" stop-opacity="1"/>
      <stop offset=".62" stop-color="#0E1014" stop-opacity="1"/>
      <stop offset="1" stop-color="#0E1014" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family:'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif; }
    .roads path { fill:none; stroke:#1B1F27; stroke-width:9; }
    .ring { fill:none; stroke-width:2; opacity:0; transform-box:fill-box; transform-origin:center; animation: pulse 2.6s ease-out infinite; }
    .route { fill:none; stroke:#F2452E; stroke-width:2.5; stroke-dasharray:3 9; stroke-linecap:round; animation: march 1.4s linear infinite; }
    .flag { animation: plant 1s cubic-bezier(.2,.8,.25,1) .3s both; }
    .pennant { transform-box:fill-box; transform-origin:left center; animation: wave 2.4s ease-in-out 1.4s infinite; }
    .word { font-size:84px; font-weight:800; letter-spacing:-2px; fill:#F6F1EA; animation: rise .9s cubic-bezier(.2,.7,.2,1) .5s both; }
    .t1 { font-size:30px; font-weight:600; fill:#F6F1EA; animation: rise .9s cubic-bezier(.2,.7,.2,1) .8s both; }
    .t2 { font-size:30px; font-weight:600; fill:#F2452E; animation: rise .9s cubic-bezier(.2,.7,.2,1) 1s both; }
    .small { font-size:16px; fill:#8B8E96; animation: rise .9s ease-out 1.2s both; }
    @keyframes pulse { 0% { transform:scale(1); opacity:.7; } 100% { transform:scale(4.2); opacity:0; } }
    @keyframes march { to { stroke-dashoffset:-48; } }
    @keyframes plant { from { transform:translateY(-26px); opacity:0; } to { transform:none; opacity:1; } }
    @keyframes wave { 0%,100% { transform:scaleX(1) skewY(0deg); } 50% { transform:scaleX(.86) skewY(6deg); } }
    @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { .ring,.route,.flag,.pennant,.word,.t1,.t2,.small { animation:none; } .ring { opacity:.35; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0E1014"/>
    <rect x="540" width="660" height="320" fill="#12151B"/>
    <g class="roads"><path d="M560 50H1200"/><path d="M560 120H1200"/><path d="M560 190H1200"/><path d="M560 260H1200"/><path d="M660 0V320"/><path d="M770 0V320"/><path d="M890 0V320"/><path d="M1000 0V320"/><path d="M1110 0V320"/><path d="M560 320L1200 40" stroke-width="12"/></g>
    <path d="M560 160C700 190 820 90 1000 130S1160 240 1200 220" fill="none" stroke="#14202B" stroke-width="30" stroke-linecap="round"/>
    <path class="route" d="M770 120C850 120 900 190 1000 190"/>
    <path class="route" d="M1000 190C1030 245 960 275 890 260" style="animation-delay:.4s"/>
    <circle cx="840" cy="205" r="7" fill="#F6F1EA"/><circle cx="840" cy="205" r="13" fill="none" stroke="#F6F1EA" stroke-opacity=".5" stroke-width="2"/>
    <g>
      <circle class="ring" cx="770" cy="120" r="8" style="animation-delay:0.0s" stroke="#F2452E"/>
      <circle cx="770" cy="120" r="8" fill="#F2452E"/><g transform="translate(786,86)"><rect width="170" height="26" rx="13" fill="#0E1014" stroke="#272B33"/><text x="12" y="18" font-size="14" fill="#F6F1EA">Pickup basketball</text></g></g><g>
      <circle class="ring" cx="1000" cy="190" r="8" style="animation-delay:0.8s" stroke="#F2452E"/>
      <circle cx="1000" cy="190" r="8" fill="#F2452E"/><g transform="translate(1016,156)"><rect width="136" height="26" rx="13" fill="#0E1014" stroke="#272B33"/><text x="12" y="18" font-size="14" fill="#F6F1EA">Study session</text></g></g><g>
      <circle class="ring" cx="890" cy="260" r="8" style="animation-delay:1.5s" stroke="#F2452E"/>
      <circle cx="890" cy="260" r="8" fill="#F2452E"/><g transform="translate(906,226)"><rect width="101" height="26" rx="13" fill="#0E1014" stroke="#272B33"/><text x="12" y="18" font-size="14" fill="#F6F1EA">Jam night</text></g></g><g>
      <circle class="ring" cx="1110" cy="50" r="5" style="animation-delay:0.4s" stroke="#F6F1EA"/>
      <circle cx="1110" cy="50" r="5" fill="#F6F1EA"/></g><g>
      <circle class="ring" cx="1140" cy="140" r="5" style="animation-delay:1.1s" stroke="#F6F1EA"/>
      <circle cx="1140" cy="140" r="5" fill="#F6F1EA"/></g>
    <rect x="540" width="180" height="320" fill="url(#fade)"/>

    <rect x="60" y="64" width="100" height="100" rx="24" fill="#F6F1EA"/>
    <path d="M70 156Q110 108 150 156Z" fill="#141414"/>
    <g class="flag">
      <path d="M110 126V82" stroke="#141414" stroke-width="4.5" stroke-linecap="round"/>
      <path class="pennant" d="M112 82L146 94L112 106Z" fill="#F2452E"/>
    </g>
    <text class="word" x="184" y="144">Rally</text>
    <text class="t1" x="62" y="222">Show up for something.</text>
    <text class="t2" x="62" y="260">Leave with a crew.</text>
    <text class="small" x="62" y="296">rallynow.ca · in development for iPhone and Android</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="318.5" rx="21.5" fill="none" stroke="#272B33" stroke-width="1.5"/>
</svg>